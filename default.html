<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
        }
        
        .welcome-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            text-align: center;
            max-width: 500px;
        }

        h2 {
            color: #111827;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .highlight-action {
            display: inline-block;
            background-color: #f3f0ff;
            color: #5e35b1;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            border: 1px dashed #c4b5fd;
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h2>Welcome to Your Dashboard</h2>
        <p>This is a placeholder page for the main content area. From here, you can view your overall stats or navigate to specific settings.</p>
        <div class="highlight-action">
            👈 Click <strong>Group Creation</strong> in the left menu to view your requested page.
        </div>
    </div>
</body>
</html>
